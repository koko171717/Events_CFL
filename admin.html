<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agenda Admin · CrossFit Léman</title><link rel="stylesheet" href="/assets/base.css"></head><body><header class="top"><div class="top-inner"><a href="/" class="brand">← CFL <span>CONTROL</span></a><div class="actions"><a class="btn" href="/agenda.html" target="_blank">Voir l’agenda public</a><button class="btn flat" onclick="authLogout()">Déconnexion</button></div></div></header>
<main class="shell"><div class="content-title"><div><div class="eyebrow">Agenda CFL</div><h1 class="h1">Gestion des événements</h1></div><button id="newBtn" class="btn primary">+ Nouvel événement</button></div><p id="notice" class="notice hidden" aria-live="polite"></p><div id="gate" class="spinner">Vérification de la connexion…</div><div id="workspace" class="layout hidden"><section class="panel sticky"><div class="mutebar"><h2 class="h2">Événements</h2><input id="search" placeholder="Rechercher…" style="width:100%;padding:10px;background:#101722;color:white;border:1px solid #455066;border-radius:10px"></div><div class="stack" id="eventList"></div></section><section class="panel"><h2 class="h2" id="formTitle">Événement</h2><form id="eventForm"><div class="field"><label>Titre</label><input id="title" required maxlength="180"></div><div class="field"><label>Titre court pour la TV (optionnel)</label><input id="short_title" maxlength="90"></div><div class="grid2"><div class="field"><label>Début</label><input id="start_date" type="date" required></div><div class="field"><label>Fin</label><input id="end_date" type="date" required></div></div><div class="grid2"><div class="field"><label>Catégorie</label><select id="category"><option>Community Events</option><option>Sport Events</option><option>Training & Seminars</option></select></div><div class="field"><label>Publication</label><select id="status"><option value="draft">Brouillon</option><option value="published">Publié</option><option value="archived">Archivé</option></select></div></div><div class="field"><label>Description complète</label><textarea id="description" rows="5"></textarea></div><div class="field"><label>Résumé pour les aperçus (optionnel)</label><textarea id="summary" rows="2"></textarea></div><div class="grid2"><div class="field"><label>Tarif (texte libre)</label><input id="price_label"></div><div class="field"><label>Public / accès</label><input id="audience"></div></div><div class="field"><label>Lien d'inscription / information</label><input id="link_url" type="url" placeholder="https://…"></div><div class="sep"></div><h2 class="h2">Affiche ou image</h2><div class="notice" style="margin-bottom:12px">Image importée depuis cet écran dans Supabase Storage. Elle est ensuite réutilisée automatiquement par l’agenda public et CFL TV.</div><div id="posterPreview" style="height:230px;background:#0b1018;border:1px dashed #3e4a5d;border-radius:14px;display:grid;place-items:center;overflow:hidden;margin-bottom:10px">Aucune image</div><div class="field"><label>Ajouter / remplacer une image (JPEG, PNG, WebP, GIF ; maximum 10 Mo)</label><input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif"></div><div class="actions" style="margin-top:18px"><button id="saveBtn" type="submit" class="btn primary">Enregistrer</button><button type="button" id="deleteBtn" class="btn danger">Supprimer l’événement</button></div></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/config.js"></script><script src="/assets/calendar-visuals.js"></script><script src="/assets/core.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>(async()=>{if(!await requireAdmin())return;$('gate').classList.add('hidden');$('workspace').classList.remove('hidden');let events=[],current=null;const fields=['title','short_title','start_date','end_date','category','status','description','summary','price_label','audience','link_url'];const clear=()=>{current=null;$('eventForm').reset();$('status').value='draft';$('start_date').value='2027-01-01';$('end_date').value='2027-01-01';$('formTitle').textContent='Nouvel événement';$('posterPreview').innerHTML='Aucune image';$('deleteBtn').disabled=true;renderList()};function renderList(){const q=$('search').value.toLowerCase();$('eventList').innerHTML=events.filter(e=>(e.title+' '+e.category).toLowerCase().includes(q)).map(e=>`<button class="entry ${current?.id===e.id?'active':''}" data-id="${esc(e.id)}"><span class="thumb">${imgMarkup(e)}</span><span><strong>${esc(e.title)}</strong><small>${esc(period(e))}</small><small style="display:block">${e.status==='published'?'● Publié':e.status==='draft'?'○ Brouillon':'Archivé'}</small></span></button>`).join('')||'<p class="muted tiny">Aucun événement.</p>'}function choose(id){current=events.find(e=>e.id===id)||null;if(!current)return clear();fields.forEach(k=>$(k).value=current[k]||'');$('formTitle').textContent='Modifier l’événement';$('posterPreview').innerHTML=imgUrl(current)?`<img src="${esc(imgUrl(current))}" style="max-width:100%;height:100%;object-fit:contain" alt="Affiche">`:'Aucune image';$('imageFile').value='';$('deleteBtn').disabled=false;renderList()}async function load(select){try{events=await getAllEvents(true);if(select)choose(select);else if(current)choose(current.id);else if(events.length)choose(events[0].id);else clear()}catch(e){msg('notice','Erreur de lecture : '+e.message,'error')}}$('eventList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)});$('newBtn').onclick=clear;$('search').oninput=renderList;$('eventForm').addEventListener('submit',async e=>{e.preventDefault();$('saveBtn').disabled=true;try{const record=Object.fromEntries(fields.map(k=>[k,$(k).value]));record.title=record.title.trim();if(!record.title)throw Error('Titre requis');if(record.end_date<record.start_date)throw Error('La fin précède le début');record.id=current?.id||crypto.randomUUID();record.legacy_visual_key=current?.legacy_visual_key||'';record.image_url=current?.image_url||null;record.display_order=current?.display_order||0;const file=$('imageFile').files[0];if(file){if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))throw Error('Format image non autorisé');if(file.size>10*1024*1024)throw Error('Image trop lourde (max 10 Mo)');const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1];const path=`${record.id}/${crypto.randomUUID()}.${ext}`;const {error:upErr}=await CFL.client.storage.from('cfl-events').upload(path,file,{contentType:file.type,upsert:false});if(upErr)throw upErr;record.image_url=CFL.client.storage.from('cfl-events').getPublicUrl(path).data.publicUrl;}const {error}=await CFL.client.from('events').upsert(record);if(error)throw error;msg('notice','Événement enregistré. La vue publique affiche uniquement les événements publiés.','ok');await load(record.id)}catch(error){msg('notice',error.message,'error')}finally{$('saveBtn').disabled=false}});$('deleteBtn').onclick=async()=>{if(!current)return;if(!confirm('Supprimer définitivement cet événement ? Les slides liées conserveront leur configuration mais devront être révisées.'))return;const {error}=await CFL.client.from('events').delete().eq('id',current.id);if(error){msg('notice',error.message,'error');return}current=null;await load();msg('notice','Événement supprimé.','ok')};await load()})()</script></body></html>
