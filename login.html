<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion · CrossFit Léman</title><link rel="stylesheet" href="/assets/base.css"><link rel="stylesheet" href="/assets/cfl-identity-v35.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="panel" style="width:min(430px,100%);padding:33px"><div class="brand" style="font-size:31px;margin-bottom:28px">CFL <span>CONTROL</span></div><h1 class="h1">Connexion</h1><form id="form"><div class="field"><label>Adresse e-mail</label><input type="email" id="email" required autocomplete="username"></div><div class="field"><label>Mot de passe</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit" class="btn primary" style="width:100%;margin-top:14px">Se connecter</button></form><p id="notice" class="notice hidden" aria-live="polite"></p><p class="tiny muted" style="margin-top:18px">Accès réservé aux administrateurs autorisés.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/config.js"></script><script src="/assets/calendar-visuals.js"></script><script src="/assets/core.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>(async()=>{if(!CFL.valid){msg('notice','Configuration Supabase manquante. Renseignez assets/config.js avec les valeurs publiques.','error');return}if(new URLSearchParams(location.search).has('denied'))msg('notice','Votre compte ne dispose pas des droits administrateur.','error');let {data:{session}}=await CFL.client.auth.getSession();if(session){let {data}=await CFL.client.from('app_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(data){location.replace('/');return}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;const {data,error}=await CFL.client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg('notice','Connexion refusée : '+error.message,'error');b.disabled=false;return}const r=await CFL.client.from('app_admins').select('user_id').eq('user_id',data.user.id).maybeSingle();if(!r.data){await CFL.client.auth.signOut();msg('notice','Compte non autorisé.','error');b.disabled=false;return}location.replace('/')})})()</script></body></html>
