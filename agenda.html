<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Événements · CrossFit Léman</title><link rel="stylesheet" href="/assets/base.css"></head><body><header class="top"><div class="top-inner"><a href="/agenda.html" class="brand">CROSSFIT <span>LÉMAN</span></a><span class="eyebrow">Agenda des événements</span></div></header><main class="shell"><div class="content-title"><div><div class="eyebrow">Communauté CFL</div><h1 class="h1">Nos événements</h1></div><div class="toolbar"><select id="cat" class="btn"><option value="">Toutes les catégories</option><option>Community Events</option><option>Sport Events</option><option>Training & Seminars</option></select><select id="year" class="btn"></select><button id="viewBtn" class="btn">Vue liste</button></div></div><div id="err" class="notice hidden"></div><div id="publicEvents" class="grid3"></div><div id="empty" class="spinner hidden">Aucun événement publié.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/config.js"></script><script src="/assets/calendar-visuals.js"></script><script src="/assets/core.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>(async()=>{if(!CFL.valid){msg('err','Configuration Supabase manquante.','error');return}let events=[],cards=true;try{events=await getAllEvents(false)}catch(e){msg('err','Impossible de charger les événements : '+e.message,'error');return}const years=[...new Set(events.map(e=>e.start_date.slice(0,4)))].sort();$('year').innerHTML='<option value="">Toutes les années</option>'+years.map(y=>`<option value="${y}">${y}</option>`).join('');function render(){const list=events.filter(e=>(!$('cat').value||e.category===$('cat').value)&&(!$('year').value||e.start_date.startsWith($('year').value)));$('publicEvents').style.gridTemplateColumns=cards?'repeat(auto-fit,minmax(280px,1fr))':'1fr';$('publicEvents').innerHTML=list.map(e=>`<article class="panel" style="padding:0;overflow:hidden"><div style="height:${cards?'195':'120'}px;background:#0d111a;display:grid;place-items:center">${imgUrl(e)?`<img src="${esc(imgUrl(e))}" style="width:100%;height:100%;object-fit:contain" alt="Affiche ${esc(e.title)}">`:'<span class="brand">CFL</span>'}</div><div style="padding:18px"><span class="eyebrow">${esc(e.category)}</span><h2 class="h2" style="margin:10px 0">${esc(e.title)}</h2><div class="pill">${esc(period(e))}</div><p class="muted" style="line-height:1.55">${esc(e.description||e.summary)}</p>${e.price_label?`<span class="pill">${esc(e.price_label)}</span>`:''}${e.link_url?`<p><a href="${esc(e.link_url)}" target="_blank" rel="noopener noreferrer" class="btn primary">Plus d'informations</a></p>`:''}</div></article>`).join('');$('empty').classList.toggle('hidden',list.length>0)}$('cat').onchange=render;$('year').onchange=render;$('viewBtn').onclick=()=>{cards=!cards;$('viewBtn').textContent=cards?'Vue liste':'Vue cartes';render()};render()})()</script></body></html>
