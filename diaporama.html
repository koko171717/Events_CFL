<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diffusion TV · CrossFit Leman</title><link rel="stylesheet" href="/assets/base.css"><link rel="stylesheet" href="/assets/cfl-identity-v35.css"></head><body><div id="playerState" class="notice" style="position:fixed;top:10px;left:10px;z-index:10">Chargement CFL TV…</div><main id="playerFrame" class="player-overlay"><div class="tv-frame" id="liveFrame"></div><div class="player-controls"><button id="fullscreen" class="btn flat">Plein écran</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/config.js"></script><script src="/assets/calendar-visuals.js"></script><script src="/assets/calendar-references.js"></script><script src="/assets/core.js"></script><script src="/assets/cfl-wod-tv.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>(async()=>{const state=$('playerState');let currentVersion=-1,slides=[],events=[],index=0,nextAt=0;function todayCH(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function eligible(s){if(s.slide_type!=='spotlight')return true;const d=todayCH(),o=s.settings||{};return (!o.displayFrom||o.displayFrom<=d)&&(!o.displayUntil||o.displayUntil>=d)}async function refresh(){if(!CFL.valid){state.textContent='Supabase non configuré.';return}try{const [pub,ev]=await Promise.all([CFL.client.from('tv_publication').select('*').eq('channel','main').single(),getAllEvents(false)]);if(pub.error)throw pub.error;events=ev;if(pub.data.version!==currentVersion){currentVersion=pub.data.version;const latest=pub.data.slides||[];slides=latest.filter(s=>s.enabled!==false);index=Math.min(index,Math.max(0,slides.length-1));if(!slides.length){state.textContent='Aucune slide publiée pour le moment.';$('liveFrame').innerHTML='';return}state.classList.add('hidden');if(!nextAt)show(0)}}catch(e){state.textContent='Connexion impossible : '+e.message}}function show(i){if(!slides.length)return;const allowed=slides.map((s,j)=>eligible(s)?j:-1).filter(j=>j>=0);if(!allowed.length){$('liveFrame').innerHTML='';state.textContent='Aucune slide à diffuser pour cette période.';state.classList.remove('hidden');nextAt=Date.now()+10000;return}state.classList.add('hidden');let j=i%slides.length;while(!eligible(slides[j]))j=(j+1)%slides.length;index=j;let slide=slides[index];let ev=events;if(slide.event_snapshot&&!ev.find(e=>e.id===slide.event_id))ev=ev.concat([slide.event_snapshot]);artRender($('liveFrame'),slide,ev);nextAt=Date.now()+(slide.duration_seconds||15)*1000}$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});await refresh();setInterval(refresh,10000);setInterval(()=>{if(slides.length&&nextAt&&Date.now()>=nextAt)show(index+1)},200);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()})})()</script></body></html>
